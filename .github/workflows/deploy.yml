name: CD

# Deploy only after the CI workflow succeeds on main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-backend:
    name: Deploy backend (VPS)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Resolve commit
        id: commit
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: EXPECTED_SHA,DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_DIR="${DEPLOY_PATH:-$HOME/nepse-backend}"
            cd "$DEPLOY_DIR"

            echo "Deploying $EXPECTED_SHA to $DEPLOY_DIR"
            git fetch --prune origin main
            if ! git cat-file -e "$EXPECTED_SHA^{commit}" 2>/dev/null; then
              git fetch origin "$EXPECTED_SHA"
            fi
            git -c advice.detachedHead=false checkout --force "$EXPECTED_SHA"
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker restart nepse_nginx

            echo "Waiting for backend health..."
            for attempt in $(seq 1 30); do
              if docker exec nepse_backend curl -fsS http://localhost:8000/api/v1/system/health/ >/dev/null 2>&1; then
                echo "Backend healthy after $((attempt * 5))s"
                docker image prune -f >/dev/null
                echo "Deploy complete at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                exit 0
              fi
              sleep 5
            done

            echo "Backend health check failed; recent logs:"
            docker compose -f docker-compose.prod.yml logs --tail=100 backend || true
            exit 1
